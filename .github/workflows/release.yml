name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag version without leading v, for example 0.3.0
        required: true

permissions:
  contents: read

# All releases share the appcast and cask, not just releases of the same tag.
concurrency:
  group: mq-dir-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release commit
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and check out its existing tag
        id: ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          python3 Scripts/release_tools.py version --version "$VERSION" >/dev/null
          git rev-parse --verify "refs/tags/v${VERSION}^{commit}" >/dev/null
          git checkout --detach "refs/tags/v${VERSION}"
          git merge-base --is-ancestor HEAD origin/main
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check source version and build number
        id: metadata
        run: python3 Scripts/release_tools.py source --version "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Test release tools and core
        run: |
          python3 -m unittest discover -s Tests/release -v
          swift test
      - name: Generate locked project and test app services
        run: |
          Scripts/generate-project.sh
          xcodebuild -project mq-dir.xcodeproj -scheme mq-dir \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/Verified \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO test
      - name: Verify built bundle metadata
        env:
          BUILD_NUMBER: ${{ steps.metadata.outputs.build }}
        run: |
          python3 Scripts/release_tools.py bundle --version "$VERSION" --build "$BUILD_NUMBER" \
            --plist build/Verified/Build/Products/Debug/mq-dir.app/Contents/Info.plist

  release:
    name: Publish verified release or resume metadata update
    needs: verify
    runs-on: macos-14
    permissions:
      contents: write
    env:
      APP_NAME: mq-dir
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Find an existing release without treating API failure as absence
        run: |
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          cp Scripts/release_tools.py "$RUNNER_TEMP/release_tools.py"
          mkdir -p dist
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | {draft}" > "$RUNNER_TEMP/existing-release.json"
          if [[ -s "$RUNNER_TEMP/existing-release.json" ]]; then
            python3 - "$RUNNER_TEMP/existing-release.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1]))['draft']:
              sys.exit('An incomplete draft already exists. Refusing to replace its assets; inspect the failed publication first.')
          PY
            gh release download "v$VERSION" --dir dist \
              --pattern "$APP_NAME-v$VERSION.dmg" --pattern "$APP_NAME-v$VERSION.zip" \
              --pattern release.json --pattern SHA256SUMS
            python3 Scripts/release_tools.py verify --version "$VERSION" --build "$BUILD_NUMBER" --sha "$RELEASE_SHA"
            echo "BUILD_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "BUILD_RELEASE=true" >> "$GITHUB_ENV"
          fi
      - name: Install release tools
        if: env.BUILD_RELEASE == 'true'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          if ! command -v create-dmg >/dev/null 2>&1; then brew install create-dmg; fi
          # Preserve the existing signing-tool version; app dependencies are locked separately.
          SPARKLE_VERSION=2.6.4
          TOOLS_DIR="$RUNNER_TEMP/sparkle"
          mkdir -p "$TOOLS_DIR"
          curl -fL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          tar -C "$TOOLS_DIR" -xJf "$RUNNER_TEMP/sparkle.tar.xz"
          if [[ -x "$TOOLS_DIR/bin/sign-update" ]]; then
            echo "SIGN_UPDATE=$TOOLS_DIR/bin/sign-update" >> "$GITHUB_ENV"
          elif [[ -x "$TOOLS_DIR/bin/sign_update" ]]; then
            echo "SIGN_UPDATE=$TOOLS_DIR/bin/sign_update" >> "$GITHUB_ENV"
          else
            echo 'Sparkle signing tool is missing' >&2
            exit 1
          fi
      - name: Import signing certificate
        if: env.BUILD_RELEASE == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build and export signed app from the verified commit
        if: env.BUILD_RELEASE == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          test -n "$DEVELOPMENT_TEAM"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          Scripts/generate-project.sh
          xcodebuild archive -project mq-dir.xcodeproj -scheme mq-dir -configuration Release \
            -archivePath "$RUNNER_TEMP/mq-dir.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' OTHER_CODE_SIGN_FLAGS='--timestamp'
          python3 - "$RUNNER_TEMP/ExportOptions.plist" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], 'wb') as stream:
              plistlib.dump(dict(method='developer-id', signingStyle='manual',
                                teamID=os.environ['DEVELOPMENT_TEAM'], stripSwiftSymbols=True), stream)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/mq-dir.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          python3 Scripts/release_tools.py bundle --version "$VERSION" --build "$BUILD_NUMBER" \
            --plist "$RUNNER_TEMP/export/$APP_NAME.app/Contents/Info.plist"
      - name: Notarize and staple app
        if: env.BUILD_RELEASE == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          APP_PATH="$RUNNER_TEMP/export/$APP_NAME.app"
          AUTH_KEY_PATH="$RUNNER_TEMP/notary-auth.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$AUTH_KEY_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary.zip" --key "$AUTH_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$APP_PATH"
      - name: Package DMG and ZIP
        if: env.BUILD_RELEASE == 'true'
        run: |
          APP_PATH="$RUNNER_TEMP/export/$APP_NAME.app"
          create-dmg --volname "$APP_NAME" --window-size 540 380 \
            --background Resources/installer/dmg_background.png --icon-size 128 \
            --icon "$APP_NAME.app" 135 170 --app-drop-link 385 170 \
            "dist/$APP_NAME-v$VERSION.dmg" "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "dist/$APP_NAME-v$VERSION.zip"
      - name: Sign DMG and record verified artifact metadata
        if: env.BUILD_RELEASE == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          PRIV="$RUNNER_TEMP/sparkle-priv"
          trap 'rm -f "$PRIV"' EXIT
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 -D > "$PRIV"
          SIG_LINE="$("$SIGN_UPDATE" -f "$PRIV" "dist/$APP_NAME-v$VERSION.dmg")"
          python3 Scripts/release_tools.py manifest --version "$VERSION" --build "$BUILD_NUMBER" \
            --sha "$RELEASE_SHA" --signature "$SIG_LINE"
      - name: Verify artifacts and reject stale release before publishing
        run: |
          python3 Scripts/release_tools.py verify --version "$VERSION" --build "$BUILD_NUMBER" --sha "$RELEASE_SHA"
          git fetch origin main "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_SHA"
          git show origin/main:docs/appcast.xml > "$RUNNER_TEMP/appcast.xml"
          git show origin/main:Casks/mq-dir.rb > "$RUNNER_TEMP/mq-dir.rb"
          python3 Scripts/release_tools.py metadata --repository "$GITHUB_REPOSITORY" \
            --appcast "$RUNNER_TEMP/appcast.xml" --cask "$RUNNER_TEMP/mq-dir.rb" --check-only
      - name: Publish new release without replacing existing assets
        if: env.BUILD_RELEASE == 'true'
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" ]]; then
            {
              echo "## What's Changed"
              echo
              git log "$PREV_TAG..$TAG" --pretty=format:'- %s' | grep -vE '^- Release v[0-9]' || true
              echo
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$TAG"
            } > "$NOTES_FILE"
          else
            echo 'Initial release.' > "$NOTES_FILE"
          fi
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --draft --title "$APP_NAME $TAG" \
            --notes-file "$NOTES_FILE" "${FLAGS[@]}"
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false
      - name: Update appcast and cask from published bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B post-release origin/main
          # Use the verified tag's helper, not code from a newer main checkout.
          python3 "$RUNNER_TEMP/release_tools.py" metadata --repository "$GITHUB_REPOSITORY"
          git add docs/appcast.xml Casks/mq-dir.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m "Update appcast and cask for $TAG"
          git push origin HEAD:main
      - name: Mirror current cask to Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Homebrew tap token is not configured; mirror skipped.'
            exit 0
          fi
          TAP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TAP_DIR"' EXIT
          gh auth setup-git
          gh repo clone h5nam/homebrew-mq-dir "$TAP_DIR" -- --depth 1
          cp Casks/mq-dir.rb "$TAP_DIR/Casks/mq-dir.rb"
          cd "$TAP_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/mq-dir.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -s -m "Update cask after $TAG"
          git push origin HEAD:main
      - name: Clean up signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary-auth.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/sparkle-priv"
          if [[ -f "$RUNNER_TEMP/release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release.keychain-db"
          fi
