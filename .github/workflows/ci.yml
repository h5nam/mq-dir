name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: SwiftPM tests
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint Swift (advisory)
        continue-on-error: true
        run: xcrun swift-format lint --recursive Sources Tests

      - name: Test release validation
        run: |
          python3 -m unittest discover -s Tests/release -v
          python3 Scripts/release_tools.py source

      - name: Test core library
        run: swift test

  xcodebuild:
    name: Generated Xcode app build and service tests
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: Scripts/generate-project.sh

      - name: Build app and test services
        run: |
          xcodebuild \
            -project mq-dir.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -scheme mq-dir \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            test
